# CI for the 6net wire head.
#
# The workflows inherited from upstream headscale are disabled in this
# repository through the Actions API rather than by deleting them: they
# target upstream's nix binary cache, docs site, and release
# infrastructure, none of which exist here, and leaving the files
# untouched keeps merges from upstream conflict-free. Re-enable any of
# them with:
#
#   gh api -X PUT repos/6net-dev/headscale/actions/workflows/<id>/enable
name: 6net

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./hscontrol/...

      # The packages the registry rewrite runs through. The full suite
      # needs upstream's nix devShell and Docker-backed integration
      # harness; these are the tests that guard the fork's own changes.
      - name: Unit tests for the registry-facing packages
        run: go test -timeout 20m ./hscontrol/mapper/... ./hscontrol/types/...
