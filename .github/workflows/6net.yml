# CI for the 6net wire head.
#
# The workflows inherited from upstream headscale are disabled in this
# repository through the Actions API rather than by deleting them: they
# target upstream's nix binary cache, docs site, and release
# infrastructure, none of which exist here, and leaving the files
# untouched keeps merges from upstream conflict-free. Re-enable any of
# them with:
#
#   gh api -X PUT repos/6net-dev/headscale/actions/workflows/<id>/enable
name: 6net

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./hscontrol/...

      # The packages the registry channel runs through: the client and the
      # world contract, the rewrite and the batcher, the callbacks inside the
      # node write, the config keys, and the change-stream runner and its
      # disk cache in ./hscontrol itself. The full suite needs upstream's nix
      # devShell and Docker-backed integration harness; these are the tests
      # that guard the fork's own changes.
      - name: Unit tests for the registry-facing packages
        run: |
          go test -timeout 20m \
            ./hscontrol/registry/... \
            ./hscontrol/mapper/... \
            ./hscontrol/state/... \
            ./hscontrol/types/... \
            ./hscontrol/

  image:
    name: head image
    runs-on: ubuntu-latest
    needs: build

    # Only on a push. A pull request from a fork must not be handed a token
    # that can write the package registry, and a tag from a branch nobody
    # deploys is a tag nobody pins.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit and by nothing else: the deployment pins an exact
      # image, so a moving tag would be a way for a head to change under a
      # kamal accessory that never asked it to.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/6net-dev/headscale:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
